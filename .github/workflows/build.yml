name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        # This action installs a standalone Gradle version so you don't need 'gradlew'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2 # Matching your AGP version 8.2.0

      - name: Build Debug APK
        # Note: We use 'gradle' (global) instead of './gradlew' (local)
        run: gradle assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HotspotWidget-APK
          path: app/build/outputs/apk/debug/app-debug.apk